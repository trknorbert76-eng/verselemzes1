<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Belépés</title>

<style>
body{
  margin:0;
  background:#111;
  color:#eee;
  font-family:Georgia,serif;
}

.wrap{
  max-width:520px;
  margin:80px auto;
  padding:30px 20px;
}

.card{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:16px;
  padding:24px;
}

h1{
  margin-top:0;
  color:#d6b36a;
}

.intro{
  color:#bbb;
  line-height:1.6;
  margin-bottom:24px;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:10px;
  border:1px solid #444;
  background:#111;
  color:#eee;
  font-size:1rem;
  margin-bottom:16px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#d6b36a;
  color:#111;
  font-weight:bold;
  font-size:1rem;
  cursor:pointer;
  margin-bottom:12px;
}

.secondary{
  background:#2b2b2b;
  color:#eee;
  border:1px solid #444;
}

  .smallBtn{
  width:auto;
  padding:8px 14px;
  font-size:0.9rem;
  margin-top:4px;
  background:#1f1f1f;
  color:#d6b36a;
  border:1px solid #444;
}

.error{
  margin-top:16px;
  color:#ff9b9b;
  line-height:1.5;
}

.ok{
  margin-top:16px;
  color:#b7efb7;
  line-height:1.5;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>Versminőség-elemző</h1>

    <div class="intro">
      Regisztrálj email címmel vagy lépj be a meglévő hozzáférési kódoddal.
    </div>

    <input
      type="email"
      id="emailInput"
      placeholder="Email címed"
    />

    <input
      type="text"
      id="codeInput"
      placeholder="Belépőkód (ha már van)"
    />

    <button id="registerBtn">
      Új regisztráció
    </button>

    <button id="loginBtn" class="secondary">
      Belépés meglévő kóddal
    </button>

    <button id="recoverBtn" class="smallBtn">
  Elfelejtett kód
</button>

    <div id="message"></div>

  </div>
</div>

<script>

const WORKER_URL =
  "https://belepes-public.trknorbert76.workers.dev";

const emailInput = document.getElementById("emailInput");
const codeInput = document.getElementById("codeInput");

const registerBtn = document.getElementById("registerBtn");
const loginBtn = document.getElementById("loginBtn");
  const recoverBtn =
  document.getElementById("recoverBtn");

const message = document.getElementById("message");

// DEVICE ID

let deviceId = localStorage.getItem("device_id");

if (!deviceId) {
  deviceId = crypto.randomUUID();
  localStorage.setItem("device_id", deviceId);
}

function showError(text) {
  message.className = "error";
  message.textContent = text;
}

function showOk(text) {
  message.className = "ok";
  message.textContent = text;
}

function setLoading(button, loadingText) {
  button.disabled = true;
  button.dataset.original = button.textContent;
  button.textContent = loadingText;
}

function clearLoading(button) {
  button.disabled = false;
  button.textContent = button.dataset.original;
}

// ========================
// REGISZTRÁCIÓ
// ========================

registerBtn.addEventListener("click", async () => {

  const email =
    emailInput.value.trim().toLowerCase();

  if (!email || !email.includes("@")) {
    showError("Adj meg egy érvényes email címet.");
    return;
  }

  setLoading(registerBtn, "Regisztráció...");

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "register",
        email,
        device_id: deviceId
      })
    });

    const data = await response.json();

    if (!data.ok) {
      showError(data.error || "Sikertelen regisztráció.");
      return;
    }

    showOk(
`Sikeres regisztráció.

Belépőkódod:

${data.access_code}

Ingyenes elemzések:
${data.free_uses}`
    );

  } catch (err) {

    showError(
      err.message || "Kapcsolódási hiba."
    );

  } finally {

    clearLoading(registerBtn);

  }
});

// ========================
// BELÉPÉS
// ========================

loginBtn.addEventListener("click", async () => {

  const email =
    emailInput.value.trim().toLowerCase();

  const code =
    codeInput.value.trim();

  if (!email || !email.includes("@")) {
    showError("Adj meg egy érvényes email címet.");
    return;
  }

  if (!code) {
    showError("Add meg a belépőkódot.");
    return;
  }

  setLoading(loginBtn, "Belépés...");

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "login",
        email,
        code,
        device_id: deviceId
      })
    });

    const data = await response.json();

    if (!data.ok) {
      showError(data.error || "Sikertelen belépés.");
      return;
    }

    localStorage.setItem("paid_access_ok", "1");
    localStorage.setItem("user_email", email);

    showOk("Belépés sikeres...");

    setTimeout(() => {
      window.location.href = "index.html";
    }, 700);

  } catch (err) {

    showError(
      err.message || "Kapcsolódási hiba."
    );

  } finally {

    clearLoading(loginBtn);

  }
});

  // ========================
// ELFELEJTETT KÓD
// ========================

recoverBtn.addEventListener("click", async () => {

  const email =
    emailInput.value.trim().toLowerCase();

  if (!email || !email.includes("@")) {
    showError("Add meg az email címedet.");
    return;
  }

  setLoading(recoverBtn, "Keresés...");

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "recover",
        email,
        device_id: deviceId
      })
    });

    const data = await response.json();

    if (!data.ok) {
      showError(data.error || "Nem sikerült lekérni a kódot.");
      return;
    }

    showOk(
`A belépőkódod:

${data.access_code}

Másold be ezt a belépőkód mezőbe.`
    );

  } catch (err) {

    showError(
      err.message || "Kapcsolódási hiba."
    );

  } finally {

    clearLoading(recoverBtn);

  }
});

</script>

</body>
</html>
